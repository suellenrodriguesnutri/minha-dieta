<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Dieta</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F5D50">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--bg:#f7f5ef;--card:#fff;--ink:#1f2a26;--mut:#5f6b66;--g:#2F5D50;--line:#e3dfd4}
  @media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2320;--ink:#e9efec;--mut:#a3b0aa;--g:#8cc5b2;--line:#2c3733}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:420px;margin:24px 16px;padding:32px 24px;background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:center}
  img{width:72px;height:72px;border-radius:16px}
  h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;color:var(--g);margin:16px 0 8px}
  p{margin:0 0 10px;color:var(--mut)}
  .assin{margin-top:18px;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>App em manutenção</h1>
  <p>O Minha Dieta está temporariamente fora do ar.</p>
  <p>Em breve ele volta. Se tiver dúvidas, fale com a nutricionista pelo Instagram.</p>
  <p class="assin"><strong>@suellenrodrigues.nutri</strong></p>
</main>
<script>
  // remove a versão antiga guardada no celular
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
